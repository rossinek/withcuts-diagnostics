<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111110">
  <meta name="description" content="Local video diagnostics for WithSubtitles.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Video check · WithSubtitles</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header><button id="back-button" class="back-button" type="button" aria-label="Choose another video" hidden>←</button><span class="wordmark">WithSubtitles<span class="brand-dot">.</span></span><span id="step-label" class="step-label">VIDEO CHECK</span></header>
    <noscript><p>Enable JavaScript to check your video.</p></noscript>
    <section data-screen="choose" aria-labelledby="choose-heading">
      <div class="screen-content intro"><h1 id="choose-heading">Video<br><span class="accent">check.</span></h1><p class="privacy">Play your video four ways on your device, choose what you see, then share the report.</p><label class="primary file-button">Choose video <span aria-hidden="true">↗</span><input id="file-input" type="file" accept="video/*,.mov,.mp4,.m4v"></label><button id="sample-button" class="text-button" type="button">Use a sample</button><p id="file-error" role="status" hidden></p></div>
    </section>
    <section data-screen="loading" aria-labelledby="loading-heading" hidden>
      <div class="screen-content"><p id="metadata-count" class="eyebrow">01 / 02</p><h1 id="loading-heading">Reading<br>video<span class="accent">.</span></h1><div class="loading-line" aria-hidden="true"></div><div id="probe-mount"></div><p id="loading-status" class="status" role="status"></p></div>
    </section>
    <section data-screen="playback" aria-labelledby="test-title" hidden>
      <div class="screen-content playback-content">
        <h1 id="test-title" class="test-title">Regular playback<span class="accent">.</span></h1>
        <div id="preview" class="preview">
          <video id="visible-video" playsinline preload="metadata" hidden></video>
          <canvas id="canvas" width="640" height="360" hidden></canvas>
          <button id="preview-toggle" class="preview-toggle" type="button" aria-label="Play video"><span aria-hidden="true">▶</span></button>
        </div>
        <div id="source-preview" class="source-preview" hidden><span>Source</span></div>
        <div class="transport">
          <button id="toggle-button" type="button" class="transport-button" aria-label="Play video">▶ Play</button>
          <label class="seek-label"><span class="sr-only">Video position</span><input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled></label>
          <span id="time-display">0:00</span>
        </div>
        <p id="playback-status" class="status" role="status"></p>
        <fieldset class="answers"><legend>What do you see?</legend>
          <label><input type="radio" name="result" value="moving-picture"><span>Moving picture</span></label>
          <label><input type="radio" name="result" value="audio-only"><span>Audio only</span></label>
          <label><input type="radio" name="result" value="nothing"><span>No picture or sound</span></label>
          <label><input type="radio" name="result" value="frozen-or-distorted"><span>Frozen / distorted</span></label>
          <label><input type="radio" name="result" value="cannot-play"><span>Wouldn’t play</span></label>
        </fieldset>
        <div class="test-actions"><button id="next-button" class="primary" type="button" disabled>Next test <span aria-hidden="true">→</span></button><button id="skip-button" class="text-button" type="button">Skip</button></div>
      </div>
    </section>
    <section data-screen="report" aria-labelledby="report-heading" hidden>
      <div class="screen-content"><p id="report-count" class="eyebrow">4 CHECKS</p><h1 id="report-heading">Report<br><span class="accent">ready.</span></h1><button id="share-button" class="primary" type="button">Share report <span aria-hidden="true">↗</span></button><div class="report-alternatives"><button id="download-button" class="text-button" type="button">Download</button><button id="copy-button" class="text-button" type="button">Copy</button></div><p id="share-status" class="status" role="status"></p><details class="device-details"><summary>Add details</summary><div class="fields"><label>iPhone model<input id="device-model" maxlength="80" placeholder="iPhone 16 Pro" autocomplete="off"></label><label>iOS version<input id="os-version" maxlength="80" placeholder="27.0" autocomplete="off"></label><label>Notes<textarea id="notes" rows="2" maxlength="2000"></textarea></label></div></details><details id="report-details"><summary>View report</summary><pre id="report-preview" tabindex="0"></pre></details></div>
    </section>
  </main>
</body>
</html>
